name: lao-rice-api

# Uses the shared PostgreSQL (container `shared_pg`, external network `sharedpg`)
# instead of a per-project db container. Data lives in database "lao_rice" on
# shared_pg, owned by role "laorice" (single role — no RLS). The password comes
# from this box's unchanged .env (DB_PASSWORD), so a rollback to the prior
# own-db compose still matches.

services:
  api:
    # Hardening (2026-10-10, after a cryptominer was dropped into a container):
    # read-only filesystem, /tmp that can't execute, no Linux capabilities, no
    # privilege escalation, and CPU/memory/process caps so one compromised app
    # can't run a dropped binary or take over the whole VPS.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    # Runs as root but writes to media folders owned by the deploy user.
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lao-rice-api
    image: lao-rice-api:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"   # Caddy is the only public entry point
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://laorice:${DB_PASSWORD:-postgres}@${DB_HOST:-shared_pg}:5432/lao_rice?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-secret}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}
      SHIPPING_FEE_LAK: ${SHIPPING_FEE_LAK:-30000}
      FREE_SHIPPING_MIN_SUBTOTAL_LAK: ${FREE_SHIPPING_MIN_SUBTOTAL_LAK:-500000}
      UPLOAD_DIR: /app/uploads
      UPLOAD_URL_PREFIX: /uploads
      IMAGES_DIR: /app/images
    volumes:
      - ./uploads:/app/uploads
      - ./images:/app/images
    networks:
      - default
      - sharedpg

networks:
  sharedpg:
    external: true
