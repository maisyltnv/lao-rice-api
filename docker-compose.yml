name: lao-rice-api

services:
  db:
    image: postgres:16-alpine
    container_name: lao-rice-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: lao_rice
    ports:
      - "5433:5432"
    volumes:
      - lao_rice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lao_rice"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lao-rice-api
    image: lao-rice-api:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/lao_rice?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-secret}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}
      SHIPPING_FEE_LAK: ${SHIPPING_FEE_LAK:-30000}
      FREE_SHIPPING_MIN_SUBTOTAL_LAK: ${FREE_SHIPPING_MIN_SUBTOTAL_LAK:-500000}
      UPLOAD_DIR: /app/uploads
      UPLOAD_URL_PREFIX: /uploads
      IMAGES_DIR: /app/images
    volumes:
      - ./uploads:/app/uploads
      - ./images:/app/images
    depends_on:
      db:
        condition: service_healthy

volumes:
  lao_rice_pgdata:
